<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Gourav Bhimavarapu — Software Engineer</title>
  <desc id="description">Software engineer focused on Python, applied AI, and product engineering.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1324"/>
      <stop offset="1" stop-color="#12233A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>

  <style>
    .name { font: 700 51px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -1px; }
    .role { font: 500 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { font: 650 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.7px; }
    .chip { font: 650 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .6px; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#background)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="9" height="300" fill="url(#accent)"/>

    <text x="72" y="66" class="label" fill="#5EEAD4">SOFTWARE ENGINEER</text>
    <text x="72" y="127" class="name" fill="#F8FAFC">Gourav Bhimavarapu</text>
    <text x="72" y="169" class="role" fill="#B8C7D9">Python · Applied AI · Product engineering</text>
    <text x="72" y="205" class="role" fill="#8195AA" font-size="17">Building useful systems with clear decisions and reliable results.</text>

    <g transform="translate(72 238)">
      <rect width="92" height="31" rx="15.5" fill="#132F35" stroke="#2DD4BF" stroke-opacity=".55"/>
      <text x="46" y="20" class="chip" fill="#99F6E4" text-anchor="middle">PYTHON</text>
    </g>
    <g transform="translate(176 238)">
      <rect width="112" height="31" rx="15.5" fill="#172A42" stroke="#60A5FA" stroke-opacity=".48"/>
      <text x="56" y="20" class="chip" fill="#BFDBFE" text-anchor="middle">APPLIED AI</text>
    </g>
    <g transform="translate(300 238)">
      <rect width="182" height="31" rx="15.5" fill="#172A42" stroke="#60A5FA" stroke-opacity=".35"/>
      <text x="91" y="20" class="chip" fill="#C7D8E7" text-anchor="middle">PRODUCT ENGINEERING</text>
    </g>

    <g transform="translate(965 46)">
      <rect width="163" height="34" rx="17" fill="#102E2D" stroke="#2DD4BF" stroke-opacity=".55"/>
      <circle cx="20" cy="17" r="5" fill="#2DD4BF"/>
      <text x="35" y="21" class="label" fill="#99F6E4" font-size="9.5">OPEN TO WORK</text>
    </g>

    <path d="M884 128h244M884 151h176M884 174h212" stroke="#60A5FA" stroke-opacity=".16" stroke-width="2" stroke-linecap="round"/>
    <circle cx="884" cy="128" r="4" fill="#2DD4BF"/>
    <circle cx="1060" cy="151" r="4" fill="#60A5FA"/>
    <circle cx="1096" cy="174" r="4" fill="#94A3B8"/>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#7DD3FC" stroke-opacity=".14" stroke-width="2"/>
</svg>
